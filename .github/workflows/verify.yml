name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test 2>&1 | tee test-output.log
      - name: Build production bundle
        run: npm run build 2>&1 | tee build-output.log
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            test-output.log
            build-output.log
          retention-days: 7
