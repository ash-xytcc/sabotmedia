name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
      - name: Probe live podcast cover endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > podcast-cover-probe.log
          for slug in molotov-now the-child-and-its-enemies get-to-know-your-neighborhood; do
            echo "=== $slug ===" | tee -a podcast-cover-probe.log
            curl --location --silent --show-error \
              --output "/tmp/${slug}.cover" \
              --dump-header "/tmp/${slug}.headers" \
              --write-out 'status=%{http_code} content_type=%{content_type} bytes=%{size_download} final_url=%{url_effective}\n' \
              "https://sabot.media/podcast-covers/${slug}" | tee -a podcast-cover-probe.log || true
            sed -n '1,20p' "/tmp/${slug}.headers" | tee -a podcast-cover-probe.log || true
            file "/tmp/${slug}.cover" | tee -a podcast-cover-probe.log || true
            echo | tee -a podcast-cover-probe.log
          done
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            test-output.log
            build-output.log
            podcast-cover-probe.log
          if-no-files-found: ignore
          retention-days: 7
