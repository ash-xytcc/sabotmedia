name: Refresh podcast source archives

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh fixed Sabot podcast sources
        run: |
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 --max-time 180 \
            'https://sabot.media/api/podcast-source-refresh?refresh=1'
