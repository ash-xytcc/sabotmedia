name: Harden campaign signatures v2

on:
  push:
    branches: [main]
    paths:
      - scripts/harden-campaign-signatures-v2.mjs
      - .github/workflows/harden-campaign-signatures-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/harden-campaign-signatures-v2.mjs
      - name: Render Italian social graphic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1080 -h 1350 public/campaigns/autistici-inventati/graphics/a-network-called-resistance-it.svg -o public/campaigns/autistici-inventati/graphics/a-network-called-resistance-it.png
      - run: npm test
      - run: npm run build
      - name: Commit hardening
        run: |
          git config user.name "ash.budding"
          git config user.email "fawkes_rising@riseup.net"
          git rm scripts/harden-campaign-signatures-v2.mjs .github/workflows/harden-campaign-signatures-v2.yml
          git add functions/api/_lib/campaignSignatures.js functions/api/campaign-signatures.js src/components/CampaignSignatures.jsx functions/api/native-translations.js src/publicTranslationSelector.js functions/api/_lib/nativePublicTranslations.js functions/api/_lib/bundledNativeTranslations.js functions/api/_lib/bundledCampaignSignatureSeeds.js public/campaigns/autistici-inventati/graphics/a-network-called-resistance-it.png
          git commit -m "tighten signing tokens and italian translation"
          git push origin HEAD:main
