name: Apply officials letter action

on:
  push:
    paths:
      - '.github/workflows/apply-officials-letter-action.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'add dedicated officials letter action'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch campaign action
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          page = 'src/components/CampaignPage.jsx'
          replace_once(page,
              "const CAMPAIGN_SECTION_ORDER = ['status', 'reporting', 'letters', 'act', 'graphics', 'updates', 'timeline', 'coverage', 'sources', 'faq', 'translations', 'signatories', 'social', 'donate', 'socialArchive', 'dispatches', 'questions', 'benefit']",
              "const CAMPAIGN_SECTION_ORDER = ['status', 'reporting', 'officialsLetter', 'letters', 'act', 'graphics', 'updates', 'timeline', 'coverage', 'sources', 'faq', 'translations', 'signatories', 'social', 'donate', 'socialArchive', 'dispatches', 'questions', 'benefit']")
          replace_once(page,
              "  reporting: { nav: 'Reporting', title: 'Reporting and context' },\n  letters: { nav: 'Letters', title: 'Letters and resources' },",
              "  reporting: { nav: 'Reporting', title: 'Reporting and context' },\n  officialsLetter: { nav: 'Write officials', title: 'Send a letter to officials' },\n  letters: { nav: 'Open letter', title: 'Open letter and resources' },")
          replace_once(page,
              "  status: 'What is happening now', reporting: 'Read before you repeat', letters: 'Read it. Sign it. Send it.',",
              "  status: 'What is happening now', reporting: 'Read before you repeat', officialsLetter: 'Personalize it. Send it to officials.', letters: 'Read it. Sign it.',")
          replace_once(page,
              "  const reportingResources = (campaign?.resources || []).filter((item) => !/letter|template/i.test(`${item.type} ${item.title}`))\n  const letterResources = (campaign?.resources || []).filter((item) => /letter|template/i.test(`${item.type} ${item.title}`))",
              "  const individualLetter = campaign?.individualLetter || null\n  const reportingResources = (campaign?.resources || []).filter((item) => !/letter|template/i.test(`${item.type} ${item.title}`))\n  const letterResources = (campaign?.resources || []).filter((item) => /letter|template/i.test(`${item.type} ${item.title}`) && item.id !== individualLetter?.resourceId)")
          replace_once(page,
              "    reporting: reportingPieces.length > 0 || reportingResources.length > 0,\n    letters: letterPieces.length > 0 || letterResources.length > 0,",
              "    reporting: reportingPieces.length > 0 || reportingResources.length > 0,\n    officialsLetter: Boolean(individualLetter?.href),\n    letters: letterPieces.length > 0 || letterResources.length > 0,")
          replace_once(page,
              "              {showSection('reporting') ? <EditableLink className=\"campaign-button campaign-button--light\" labelField={`campaign.${campaign.slug}.actions.reporting.label`} hrefField={`campaign.${campaign.slug}.actions.reporting.href`} defaultLabel=\"Read the reporting\" defaultHref=\"#reporting\" /> : null}\n              {showSection('letters') ? <EditableLink className=\"campaign-button campaign-button--dark\" labelField={`campaign.${campaign.slug}.actions.letters.label`} hrefField={`campaign.${campaign.slug}.actions.letters.href`} defaultLabel=\"Read the letters\" defaultHref=\"#letters\" /> : null}",
              "              {showSection('reporting') ? <EditableLink className=\"campaign-button campaign-button--light\" labelField={`campaign.${campaign.slug}.actions.reporting.label`} hrefField={`campaign.${campaign.slug}.actions.reporting.href`} defaultLabel=\"Read the reporting\" defaultHref=\"#reporting\" /> : null}\n              {showSection('officialsLetter') ? <EditableLink className=\"campaign-button campaign-button--light\" labelField={`campaign.${campaign.slug}.actions.officials-letter.label`} hrefField={`campaign.${campaign.slug}.actions.officials-letter.href`} defaultLabel=\"Write to officials\" defaultHref=\"#officialsLetter\" /> : null}\n              {showSection('letters') ? <EditableLink className=\"campaign-button campaign-button--dark\" labelField={`campaign.${campaign.slug}.actions.letters.label`} hrefField={`campaign.${campaign.slug}.actions.letters.href`} defaultLabel=\"Read the open letter\" defaultHref=\"#letters\" /> : null}")
          marker = "      {showSection('letters') ? <section className=\"campaign-section campaign-section--paper\" id=\"letters\">"
          block = """      {showSection('officialsLetter') ? <section className=\"campaign-section campaign-section--officials-letter\" id=\"officialsLetter\">\n        <div className=\"campaign-shell\">\n          <SectionHeading sectionKey=\"officialsLetter\" eyebrow=\"INDIVIDUAL ACTION\" title={sectionTitle('officialsLetter')} description={individualLetter.description || 'Download the template, rewrite it in your own voice, and send it directly to the officials and institutions with power to act.'} />\n          <article className=\"campaign-officials-letter-card\">\n            <div>\n              <span>PERSONALIZE + SEND</span>\n              <h3>{individualLetter.title || 'Individual letter template'}</h3>\n              <p>{individualLetter.guidance || 'Use the recipient guidance in the template, add your own introduction or experience, and send the letter directly. A personalized message is harder to dismiss than a copied form letter.'}</p>\n            </div>\n            <SmartLink href={individualLetter.href}>{individualLetter.label || 'Open / download the letter template'} ↗</SmartLink>\n          </article>\n        </div>\n      </section> : null}\n\n"""
          replace_once(page, marker, block + marker)
          replace_once(page,
              "          <SectionHeading sectionKey=\"letters\" eyebrow=\"LETTERS\" title={sectionTitle('letters')} description=\"Use the organizational letter or the individual template, then send it directly to the relevant institutions and decision-makers.\" />",
              "          <SectionHeading sectionKey=\"letters\" eyebrow=\"OPEN LETTER\" title={sectionTitle('letters')} description=\"Read the public open letter, add your name or organization, and circulate the collective statement. The individual send-to-officials template now has its own action section above.\" />")

          sections = 'src/lib/campaignSections.js'
          replace_once(sections,
              "  { key: 'reporting', label: 'Reporting + context', nav: 'Reporting', title: 'Reporting and context', description: 'Sabot reporting and contextual resources connected to this campaign.', editor: 'resources' },\n  { key: 'letters', label: 'Letters + resources', nav: 'Letters', title: 'Letters and resources', description: 'Public letters, templates, documents, PDFs, and other campaign resources.', editor: 'resources' },",
              "  { key: 'reporting', label: 'Reporting + context', nav: 'Reporting', title: 'Reporting and context', description: 'Sabot reporting and contextual resources connected to this campaign.', editor: 'resources' },\n  { key: 'officialsLetter', label: 'Individual letter to officials', nav: 'Write officials', title: 'Send a letter to officials', description: 'A prominent individual action template supporters can personalize and send directly to officials or institutions.', editor: 'resources' },\n  { key: 'letters', label: 'Open letter + resources', nav: 'Open letter', title: 'Open letter and resources', description: 'Public open letters, organizational sign-on documents, PDFs, and related campaign resources.', editor: 'resources' },")

          ai = 'functions/api/_lib/aiCampaignPublic.js'
          replace_once(ai,
              "    resources: dedupeByUrl([articlePdfResource, pdfResource, ...(campaign.resources || [])], 'href'),",
              "    individualLetter: { resourceId: pdfResource.id, title: 'Write to officials in your own voice', description: 'Use this individual letter as a starting point for direct outreach to government officials and institutions. Personalize it before sending so the message reflects why this matters to you.', guidance: 'The PDF includes recipient guidance for the United States, European Union, Italy and other countries. Add your own introduction, local context or experience, then send it directly to the relevant offices.', href: letterPdf, label: 'Download the individual letter template' },\n    resources: dedupeByUrl([articlePdfResource, pdfResource, ...(campaign.resources || [])], 'href'),")

          css = Path('src/campaign-page.css')
          css_text = css.read_text()
          addition = """\n\n/* Dedicated individual outreach action: intentionally larger than ordinary action cards. */\n.campaign-section--officials-letter { background: var(--campaign-paper); color: var(--campaign-ink); border-color: #c9c2b6; }\n.campaign-officials-letter-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(28px, 6vw, 84px); align-items: end; padding: clamp(28px, 5vw, 58px); border: 3px solid var(--campaign-ink); background: var(--campaign-paper-2); box-shadow: 10px 10px 0 var(--campaign-red); }\n.campaign-officials-letter-card span { display: inline-block; margin-bottom: 18px; color: var(--campaign-red-deep); font: 900 .72rem/1 var(--campaign-display); letter-spacing: .09em; text-transform: uppercase; }\n.campaign-officials-letter-card h3 { max-width: 14ch; margin: 0 0 18px; font: 900 clamp(2rem, 4.6vw, 4.9rem)/.88 var(--campaign-display); letter-spacing: -.05em; text-transform: uppercase; }\n.campaign-officials-letter-card p { max-width: 54rem; margin: 0; font-size: 1.04rem; line-height: 1.55; }\n.campaign-officials-letter-card > a { min-width: min(100%, 260px); padding: 18px 22px; border: 2px solid var(--campaign-ink); background: var(--campaign-ink); color: #fff; font: 900 .82rem/1.15 var(--campaign-display); letter-spacing: .04em; text-align: center; text-decoration: none; text-transform: uppercase; }\n.campaign-officials-letter-card > a:hover, .campaign-officials-letter-card > a:focus-visible { background: var(--campaign-red); border-color: var(--campaign-red); }\n@media (max-width: 720px) { .campaign-officials-letter-card { grid-template-columns: 1fr; box-shadow: 6px 6px 0 var(--campaign-red); } .campaign-officials-letter-card > a { width: 100%; } }\n"""
          if 'campaign-section--officials-letter' not in css_text:
              css.write_text(css_text.rstrip() + addition + '\n')

          test = Path('tests/campaign-officials-letter-action.test.mjs')
          test.write_text("""import assert from 'node:assert/strict'\nimport fs from 'node:fs'\n\nconst page = fs.readFileSync('src/components/CampaignPage.jsx', 'utf8')\nconst sections = fs.readFileSync('src/lib/campaignSections.js', 'utf8')\nconst ai = fs.readFileSync('functions/api/_lib/aiCampaignPublic.js', 'utf8')\n\nassert.match(sections, /key: 'officialsLetter'/)\nassert.match(page, /showSection\('officialsLetter'\)/)\nassert.match(page, /id=\"officialsLetter\"/)\nassert.match(page, /defaultLabel=\"Write to officials\"/)\nassert.match(page, /item\.id !== individualLetter\?\.resourceId/)\nassert.match(ai, /individualLetter: \{ resourceId: pdfResource\.id/)\nassert.match(ai, /Download the individual letter template/)\nassert.doesNotMatch(page, /Use the organizational letter or the individual template/)\n\nconsole.log('campaign officials letter action checks passed')\n""")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'ash.budding'
          git config user.email 'bjgarr@gmail.com'
          git add src/components/CampaignPage.jsx src/lib/campaignSections.js functions/api/_lib/aiCampaignPublic.js src/campaign-page.css tests/campaign-officials-letter-action.test.mjs
          git commit -m 'add dedicated officials letter action'
          git push origin main
