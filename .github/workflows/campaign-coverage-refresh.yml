name: Refresh campaign coverage archive

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh fixed A/I coverage sources
        run: |
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 --max-time 120 \
            'https://sabot.media/api/campaign-coverage?campaign=autistici-inventati&refresh=1&limit=1'
