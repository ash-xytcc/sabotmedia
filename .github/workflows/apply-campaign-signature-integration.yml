name: Apply campaign signing integration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-campaign-signature-integration.mjs
      - .github/workflows/apply-campaign-signature-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-campaign-signature-integration.mjs
      - run: npm test
      - run: npm run build
      - name: Commit integration
        run: |
          git config user.name "ash.budding"
          git config user.email "fawkes_rising@riseup.net"
          git rm scripts/apply-campaign-signature-integration.mjs .github/workflows/apply-campaign-signature-integration.yml
          git add src/components/CampaignPage.jsx src/components/CampaignAdminPage.jsx functions/api/campaign-signatures.js functions/api/_lib/nativePublicTranslations.js
          git commit -m "wire signing queue into campaign pages"
          git push origin HEAD:main
