name: Fix legacy podcast show membership once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-podcast-show-membership-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch podcast membership and stable public merge
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/components/PodcastAdminPage.jsx',
              "import { adminRoutes } from '../routing/routes'\n",
              "import { adminRoutes } from '../routing/routes'\nimport { podcastEntryBelongsToShow } from '../../shared/podcastShowMembership'\n"
          )
          replace(
              'src/components/PodcastAdminPage.jsx',
              "function showSourceUrls(show) {\n  return [...new Set([\n    ...(Array.isArray(show?.sourceFeedUrls) ? show.sourceFeedUrls : []),\n    show?.sourceFeedUrl,\n    show?.sourceFeedResolvedUrl,\n  ].map((value) => String(value || '').trim()).filter(Boolean))]\n}\n\nfunction episodeBelongsToShow(episode, show) {\n  const sourceUrl = String(episode?.sourceUrl || '').trim()\n  return Boolean(sourceUrl && showSourceUrls(show).includes(sourceUrl))\n}\n\n",
              ""
          )
          replace(
              'src/components/PodcastAdminPage.jsx',
              "episodes: podcastEpisodes.filter((episode) => episodeBelongsToShow(episode, show)),",
              "episodes: podcastEpisodes.filter((episode) => podcastEntryBelongsToShow(episode, show)),"
          )

          replace(
              'functions/api/_lib/podcastSettings.js',
              "import { listNativeEntries } from './nativePublicContent.js'\n",
              "import { listNativeEntries } from './nativePublicContent.js'\nimport { podcastEntryBelongsToShow } from '../../../shared/podcastShowMembership.js'\n"
          )
          replace(
              'functions/api/_lib/podcastSettings.js',
              "export function podcastShowOwnsEntry(show, entry) {\n  if (!show || !entry || entry.contentType !== 'podcast') return false\n  const sourceUrl = cleanUrl(entry.sourceUrl)\n  if (!sourceUrl) return false\n  return podcastShowSourceUrls(show).includes(sourceUrl)\n}",
              "export function podcastShowOwnsEntry(show, entry) {\n  return podcastEntryBelongsToShow(entry, show)\n}"
          )

          replace(
              'src/lib/nativePublicFeed.js',
              "export function mergeNativeAndImportedPieces(importedPieces = [], nativePieces = []) {\n  const byKey = new Map()\n\n  for (const item of importedPieces || []) {\n    byKey.set(getPublicPieceMergeKey(item), item)\n  }\n\n  for (const item of nativePieces || []) {\n    byKey.set(getPublicPieceMergeKey(item), item)\n  }\n\n  return [...byKey.values()]\n    .filter((item) => item?.hidden !== true)\n    .sort((a, b) => new Date(b.publishedAt || b.updatedAt || 0) - new Date(a.publishedAt || a.updatedAt || 0))\n}\n\nfunction getPublicPieceMergeKey(item) {\n  return String(item?.slug || item?.sourcePostId || item?.id || '').trim().toLowerCase()\n}",
              "export function mergeNativeAndImportedPieces(importedPieces = [], nativePieces = []) {\n  const merged = []\n  const indexByKey = new Map()\n\n  function add(item) {\n    const keys = getPublicPieceMergeKeys(item)\n    const existingIndex = keys.map((key) => indexByKey.get(key)).find((index) => Number.isInteger(index))\n    if (Number.isInteger(existingIndex)) {\n      merged[existingIndex] = item\n      for (const key of keys) indexByKey.set(key, existingIndex)\n      return\n    }\n    const nextIndex = merged.length\n    merged.push(item)\n    for (const key of keys) indexByKey.set(key, nextIndex)\n  }\n\n  for (const item of importedPieces || []) add(item)\n  for (const item of nativePieces || []) add(item)\n\n  return merged\n    .filter((item) => item?.hidden !== true)\n    .sort((a, b) => new Date(b.publishedAt || b.updatedAt || 0) - new Date(a.publishedAt || a.updatedAt || 0))\n}\n\nfunction getPublicPieceMergeKeys(item) {\n  const values = [\n    ['slug', item?.slug],\n    ['source', item?.sourcePostId || item?.sourceExternalId],\n    ['id', item?.id],\n  ]\n  return values\n    .map(([kind, value]) => `${kind}:${String(value || '').trim().toLowerCase()}`)\n    .filter((key) => !key.endsWith(':'))\n}"
          )

          for path in ['src/lib/nativePublicContent.js', 'functions/api/_lib/nativePublicContent.js']:
              replace(
                  path,
                  "    sourcePostId: String(raw.sourcePostId || raw.sourceExternalId || ''),\n",
                  "    sourcePostId: String(raw.sourcePostId || raw.sourceExternalId || ''),\n    primaryProject: String(raw.primaryProject || ''),\n    primaryProjectSlug: String(raw.primaryProjectSlug || ''),\n    podcastTitle: String(raw.podcastTitle || ''),\n    showTitle: String(raw.showTitle || ''),\n    seriesTitle: String(raw.seriesTitle || ''),\n"
              )

          test = r'''import test from 'node:test'
import assert from 'node:assert/strict'
import { podcastEntryBelongsToShow } from '../shared/podcastShowMembership.js'
import { mergeNativeAndImportedPieces } from '../src/lib/nativePublicFeed.js'

const molotov = {
  id: 'molotov-now',
  slug: 'molotov-now',
  podcastTitle: 'Molotov Now!',
  sourceFeedUrl: 'https://feeds.acast.com/public/shows/63b498adb04df50010b4f14d',
  sourceFeedUrls: ['https://feeds.acast.com/public/shows/63b498adb04df50010b4f14d'],
}

test('legacy podcast posts explicitly assigned to a show belong to it even with an old source URL', () => {
  const legacy = {
    contentType: 'podcast',
    sourceUrl: 'https://sabotmedia.noblogs.org/where-do-we-go-a-fight-for-our-lives/',
    projects: ['Molotov Now!'],
    categories: ['Molotov Now!'],
  }
  assert.equal(podcastEntryBelongsToShow(legacy, molotov), true)
})

test('explicit show assignment does not pull a podcast into another show', () => {
  const tcaie = {
    contentType: 'podcast',
    sourceUrl: 'https://sabotmedia.noblogs.org/some-old-post/',
    projects: ['The Child and Its Enemies'],
  }
  assert.equal(podcastEntryBelongsToShow(tcaie, molotov), false)
})

test('renamed native legacy posts replace their imported copy by stable source id', () => {
  const imported = [{
    id: '2356',
    sourcePostId: '2356',
    slug: 'episode-17-solitude-vs-isolation-relationships-as-anarchy',
    type: 'newsletter',
  }]
  const native = [{
    id: 'imported-2356',
    sourcePostId: '2356',
    slug: 'solitude-vs-isolation-relationships-as-anarchy',
    contentType: 'podcast',
    projects: ['Molotov Now!'],
  }]
  const merged = mergeNativeAndImportedPieces(imported, native)
  assert.equal(merged.length, 1)
  assert.equal(merged[0].slug, 'solitude-vs-isolation-relationships-as-anarchy')
  assert.equal(merged[0].contentType, 'podcast')
})
'''
          Path('tests/podcast-legacy-show-membership.test.mjs').write_text(test)
      - name: Commit fix
        run: |
          git config user.name 'ash.budding'
          git config user.email 'bjgarr@gmail.com'
          git add shared/podcastShowMembership.js src/components/PodcastAdminPage.jsx src/lib/nativePublicFeed.js src/lib/nativePublicContent.js functions/api/_lib/podcastSettings.js functions/api/_lib/nativePublicContent.js tests/podcast-legacy-show-membership.test.mjs
          git commit -m 'fix legacy podcast show membership'
          git push
