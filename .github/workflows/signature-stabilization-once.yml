name: Signature failure-path stabilization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/signature-stabilization-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch signature failure paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lib_path = Path('functions/api/_lib/campaignSignatures.js')
          lib = lib_path.read_text()

          old = '''  for (const sql of statements) await db.prepare(sql).run()
  try { await db.prepare("ALTER TABLE campaign_signatures ADD COLUMN public_statement TEXT NOT NULL DEFAULT ''").run() } catch {}
}'''
          new = '''  for (const sql of statements) await db.prepare(sql).run()
  const migrations = [
    "ALTER TABLE campaign_signatures ADD COLUMN public_statement TEXT NOT NULL DEFAULT ''",
    'ALTER TABLE campaign_signatures ADD COLUMN management_token_hash TEXT',
    'ALTER TABLE campaign_signatures ADD COLUMN management_created_at TEXT',
    'ALTER TABLE campaign_signatures ADD COLUMN published_at TEXT',
    'ALTER TABLE campaign_signatures ADD COLUMN revoked_at TEXT',
    "ALTER TABLE campaign_signatures ADD COLUMN moderation_note TEXT NOT NULL DEFAULT ''",
    "ALTER TABLE campaign_signatures ADD COLUMN duplicate_flags_json TEXT NOT NULL DEFAULT '[]'",
    "ALTER TABLE campaign_signatures ADD COLUMN abuse_flags_json TEXT NOT NULL DEFAULT '[]'",
    'ALTER TABLE campaign_signatures ADD COLUMN website_domain_match INTEGER',
  ]
  for (const sql of migrations) {
    try { await db.prepare(sql).run() } catch { /* already migrated */ }
  }
}'''
          if old not in lib:
              raise SystemExit('signature migration anchor not found')
          lib = lib.replace(old, new, 1)

          pattern = re.compile(r'''export async function resendVerification\(db, signatureId\) \{.*?\n\}\n\nexport async function getManagedSignature''', re.S)
          replacement = '''export async function resendVerification(db, signatureId) {
  await ensureCampaignSignatureTables(db)
  const row = await db.prepare(`SELECT * FROM campaign_signatures WHERE id = ? AND status = 'pending_email' LIMIT 1`).bind(signatureId).first()
  if (!row) throw httpError('Signature is not awaiting verification.', 400)
  const token = randomSecret(32)
  const expiresAt = new Date(Date.now() + VERIFY_TTL_MS).toISOString()
  const verificationTokenHash = await sha256(token)
  await db.prepare('UPDATE campaign_signatures SET verification_token_hash = ?, verification_expires_at = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?').bind(verificationTokenHash, expiresAt, row.id).run()
  return {
    signature: privateRow(row),
    verificationToken: token,
    expiresAt,
    previousVerificationTokenHash: row.verification_token_hash || null,
    previousVerificationExpiresAt: row.verification_expires_at || null,
  }
}

export async function restoreVerificationAfterDeliveryFailure(db, signatureId, previousTokenHash, previousExpiresAt) {
  await ensureCampaignSignatureTables(db)
  await db.prepare(`UPDATE campaign_signatures SET verification_token_hash = ?, verification_expires_at = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ? AND status = 'pending_email'`)
    .bind(previousTokenHash || null, previousExpiresAt || null, signatureId).run()
}

export async function getManagedSignature'''
          lib, count = pattern.subn(replacement, lib, count=1)
          if count != 1:
              raise SystemExit('resend function anchor not found')

          old = '''  const publicStatement = patch.publicStatement === undefined ? row.public_statement : clean(patch.publicStatement, 1200)
  const now = new Date().toISOString()'''
          new = '''  const publicStatement = patch.publicStatement === undefined ? row.public_statement : clean(patch.publicStatement, 1200)
  if (row.signer_type === 'individual' && !displayName) throw httpError('Display name is required.', 400)
  if (row.signer_type === 'organization' && !organizationName) throw httpError('Organization name is required.', 400)
  const now = new Date().toISOString()'''
          if old not in lib:
              raise SystemExit('managed signer validation anchor not found')
          lib = lib.replace(old, new, 1)
          lib_path.write_text(lib)

          api_path = Path('functions/api/campaign-signatures.js')
          api = api_path.read_text()
          old = '''  resendVerification,
  sendSignatureEmail,'''
          new = '''  resendVerification,
  restoreVerificationAfterDeliveryFailure,
  sendSignatureEmail,'''
          if old not in api:
              raise SystemExit('signature API import anchor not found')
          api = api.replace(old, new, 1)

          pattern = re.compile(r'''    if \(action === 'resend'\) \{.*?\n    \}\n    if \(action === 'configure'\)''', re.S)
          replacement = '''    if (action === 'resend') {
      const result = await resendVerification(db, String(body.id || ''))
      const origin = new URL(context.request.url).origin
      const verifyUrl = `${origin}/api/campaign-signatures?action=verify&token=${encodeURIComponent(result.verificationToken)}`
      try {
        await sendSignatureEmail(context.env, { to: result.signature.email, subject: `Verify your signature: ${campaign.shortTitle || campaign.title}`, text: `Verify your email address here:\n\n${verifyUrl}\n\nThis only verifies the email address. A moderator must still approve publication.` })
      } catch (emailError) {
        await restoreVerificationAfterDeliveryFailure(db, result.signature.id, result.previousVerificationTokenHash, result.previousVerificationExpiresAt).catch(() => {})
        console.error('signature verification resend failed', { code: emailError?.code || '', status: emailError?.status || 0, message: String(emailError?.message || emailError) })
        const error = new Error('The verification email could not be resent. Your previous verification link remains valid if it had not expired.')
        error.status = 503
        throw error
      }
      return json({ ok: true })
    }
    if (action === 'configure')'''
          api, count = pattern.subn(replacement, api, count=1)
          if count != 1:
              raise SystemExit('signature resend route anchor not found')
          api_path.write_text(api)

          test_path = Path('tests/signature-failure-paths.test.mjs')
          test_path.write_text('''import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport fs from 'node:fs'\n\nconst lib = fs.readFileSync(new URL('../functions/api/_lib/campaignSignatures.js', import.meta.url), 'utf8')\nconst api = fs.readFileSync(new URL('../functions/api/campaign-signatures.js', import.meta.url), 'utf8')\n\ntest('older signature tables receive all reusable lifecycle columns', () => {\n  assert.match(lib, /const migrations = \\[/)\n  assert.match(lib, /ADD COLUMN public_statement/)\n  assert.match(lib, /ADD COLUMN management_token_hash/)\n  assert.match(lib, /ADD COLUMN duplicate_flags_json/)\n  assert.match(lib, /ADD COLUMN website_domain_match/)\n})\n\ntest('failed verification resend restores the previously usable token', () => {\n  assert.match(lib, /previousVerificationTokenHash/)\n  assert.match(lib, /restoreVerificationAfterDeliveryFailure/)\n  assert.match(api, /Your previous verification link remains valid/)\n})\n\ntest('signer self-management cannot erase required public identity', () => {\n  assert.match(lib, /row\\.signer_type === 'individual' && !displayName/)\n  assert.match(lib, /row\\.signer_type === 'organization' && !organizationName/)\n})\n''')
          PY
      - run: npm test
      - run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "ash.budding"
          git config user.email "fawkes_rising@riseup.net"
          git rm .github/workflows/signature-stabilization-once.yml
          git add functions/api/_lib/campaignSignatures.js functions/api/campaign-signatures.js tests/signature-failure-paths.test.mjs
          git commit -m "stabilize signature verification failures"
          git pull --rebase origin main
          git push origin HEAD:main
