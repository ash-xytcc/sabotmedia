name: Sync package lock once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-package-lock-once.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'ash.budding'
          git config user.email 'bjgarr@gmail.com'
          git add package-lock.json
          git commit -m 'sync package lock'
          git push
